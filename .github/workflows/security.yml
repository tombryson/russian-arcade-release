name: Security checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-and-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install verified Gitleaks binary
        shell: bash
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
      - name: Check tracked source for secrets
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/source"
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" dir "$RUNNER_TEMP/source" --redact=100 --ignore-gitleaks-allow --no-banner
      - name: Check newly introduced history for secrets
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$EVENT_NAME" == pull_request || ( -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ) ]]; then
            "$RUNNER_TEMP/gitleaks-bin/gitleaks" git . --log-opts="$BASE_SHA..$HEAD_SHA" --redact=100 --ignore-gitleaks-allow --no-banner
          else
            # The first push has no previous SHA. Scan its complete history;
            # origin/main may already equal HEAD and would produce an empty range.
            "$RUNNER_TEMP/gitleaks-bin/gitleaks" git . --log-opts=--all --redact=100 --ignore-gitleaks-allow --no-banner
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1
      - name: Audit locked Python packages
        run: python -m pip_audit -r flask_vocab_app/requirements.lock --require-hashes --disable-pip
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Audit locked UI packages
        run: npm audit --prefix flask_vocab_app/ui --audit-level=low
