# Public synthetic demo. Personal installations use the private hosted entry point.
app = "russian-arcade"
primary_region = "syd"
kill_signal = "SIGTERM"
kill_timeout = 120

[build]
  dockerfile = "Dockerfile"

[env]
  PUBLIC_DEMO = "true"
  HOSTED_HOSTNAME = "russian-arcade.fly.dev"
  VOCAB_DB_PATH = "/data/vocab.db"
  WORD_POST_ASSET_DIR = "/data/assets"
  APP_MEDIA_DIR = "/data/media"
  VOCAB_UPLOAD_DIR = "/data/uploads"
  VOCAB_SESSION_DIR = "/data/sessions"
  ANKI_MEDIA_DIR = "/data/anki-media"
  GOOGLE_DRIVE_CREDENTIALS_FILE = "/data/private/credentials.json"
  GOOGLE_DRIVE_TOKEN_FILE = "/data/private/token.json"
  GOOGLE_DRIVE_CACHE_FILE = "/data/drive-cache.txt"
  GOOGLE_DRIVE_AUTO_AUTH = "false"
  WORD_POST_HOUSEHOLD_ENABLED = "false"
  HOSTED_TRIAL_ROOT = "/data/trial"
  HOSTED_ACCOUNTS_ENABLED = "false"
  AI_TRIAL_ENABLED = "false"
  PERSONAL_STUDY_TIMEZONE = "Australia/Melbourne"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/healthz"

    [http_service.checks.headers]
      Host = "russian-arcade.fly.dev"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "2gb"

[[mounts]]
  source = "arcade_data"
  destination = "/data"
