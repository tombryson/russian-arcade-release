<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Проверка Preact Hooks</title>
    {% include '_favicon.html' %}
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/static/css/style.css?v=15" />
        <style>
            .test-message {
                color: var(--color-primary);
                font-weight: bold;
                margin-top: 10px;
            }
        </style>
    </head>
    <body>
        <h1>Проверка Preact Hooks</h1>
        <div id="test-container"></div>
        <script type="module">
            import { h, render, useState } from '/static/js/preact_deps.js';

            function Test() {
                if (typeof useState !== 'function') {
                    return h(
                        'div',
                        { className: 'test-message' },
                        'Preact hooks не загрузились',
                    );
                }
                const [count, setCount] = useState(0);
                const increment = () => setCount(count + 1);
                const decrement = () => setCount(count - 1);
                return h(
                    'div',
                    { className: 'test-message' },
                    h('p', null, 'Preact работает'),
                    h('p', null, `Счетчик: ${count}`),
                    h(
                        'button',
                        {
                            onClick: increment,
                            className: 'btn btn-primary me-2',
                        },
                        'Увеличить',
                    ),
                    h(
                        'button',
                        { onClick: decrement, className: 'btn btn-secondary' },
                        'Уменьшить',
                    ),
                );
            }

            const testContainer = document.getElementById('test-container');
            if (testContainer) {
                try {
                    render(h(Test, null), testContainer);
                } catch (e) {
                    console.error('Preact render error:', e.message);
                    testContainer.innerHTML =
                        '<div class="alert alert-danger">Не удалось показать тестовый компонент: ' +
                        e.message +
                        '</div>';
                }
            } else {
                document.body.insertAdjacentHTML(
                    'beforeend',
                    '<div class="alert alert-danger">Контейнер теста не найден</div>',
                );
            }
        </script>
    </body>
</html>
